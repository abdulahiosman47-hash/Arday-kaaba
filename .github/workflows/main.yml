name: Build Arday Kaaba APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable

      - name: Extract project
        run: unzip Arday_Kaaba_App_Starter.zip

      - name: Build APK
        working-directory: Arday_Kaaba_App_Starter
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: Arday_Kaaba_App_Starter/build/app/outputs/flutter-apk/app-release.apk
